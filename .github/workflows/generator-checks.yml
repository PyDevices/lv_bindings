name: Generator checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  generator:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and LVGL
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install generator dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Run generator unit tests
        run: PYTHONPATH=. python -m pytest -q tests

      - name: Verify reproducible generated artifacts
        run: PYTHONPATH=. python -m binding.generate --check

      - name: Print generated artifact hashes
        run: PYTHONPATH=. python tools/hash_artifacts.py generated
