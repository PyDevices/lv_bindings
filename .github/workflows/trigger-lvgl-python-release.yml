# After generated/lvgl_python.c, lv_conf.h, python/display_driver.py, or the lvgl
# pin change on main, trigger lvgl-python → Sync and release (sync, GitHub Release, TestPyPI).
# The other LVGL consumer repos (lvgl-circuitpython and lvgl-micropython) sync
# from lvgl-bindings and rebuild, but they do not publish separate packages.
#
# Credentials: the PyDevices Release Automation GitHub App, via the
# PYDEVICES_APP_ID / PYDEVICES_APP_PRIVATE_KEY organization secrets. The token
# is minted per run, scoped to lvgl-python alone, and expires in an hour.

name: Trigger lvgl-python release

on:
  push:
    branches: [main]
    paths:
      - generated/lvgl_python.c
      - lv_conf.h
      - python/display_driver.py
      - lvgl

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    if: github.repository == 'PyDevices/lvgl-bindings'
    steps:
      - name: Mint an installation token for lvgl-python
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.PYDEVICES_APP_ID }}
          private-key: ${{ secrets.PYDEVICES_APP_PRIVATE_KEY }}
          owner: PyDevices
          repositories: lvgl-python

      - name: Trigger sync and release on lvgl-python
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          gh workflow run sync-and-release.yml \
            --repo PyDevices/lvgl-python \
            -f "lvgl_bindings_ref=${{ github.sha }}"
          echo "Triggered lvgl-python sync-and-release for lvgl-bindings ${{ github.sha }}"
